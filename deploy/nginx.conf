# put this at /etc/nginx/sites-available/learn-deploy
# then: sudo ln -s /etc/nginx/sites-available/learn-deploy /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_SERVER_IP;

    # IMPORTANT: nginx blocks uploads over 1MB by default.
    # this must be at least as big as MAX_UPLOAD_MB in the backend .env
    client_max_body_size 100M;

    # frontend: the files made by "npm run build"
    root /var/www/learn-deploy/frontend/dist;
    index index.html;

    # react single page app: unknown paths fall back to index.html
    location / {
        try_files $uri /index.html;
    }

    # backend api
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # uploaded images and videos
    location /uploads/ {
        proxy_pass http://127.0.0.1:3001;
    }
}
